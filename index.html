<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lean Bulk – Ernährungsplan</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;
  --bg2:#141414;
  --bg3:#1e1e1e;
  --border:rgba(255,255,255,.09);
  --text:#f2f2f2;
  --text2:#a0a0a0;
  --text3:#555555;
  --accent:#ffffff;
  --radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
*{-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}

#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}

/* HEADER */
.app-header{
  padding:52px 18px 14px;
  background:var(--bg2);
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--border);
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.header-greeting{font-size:12px;color:var(--text3);font-weight:500;letter-spacing:.3px}
.header-name{font-size:24px;font-weight:800;letter-spacing:-.5px}
.header-badge{
  background:var(--text);color:var(--bg);
  font-size:10px;font-weight:800;
  padding:4px 10px;border-radius:20px;letter-spacing:.5px;
}
.macro-strip{display:flex;gap:6px;margin-top:10px}
.macro-pill{
  flex:1;background:var(--bg3);border-radius:10px;
  padding:7px 4px;text-align:center;border:1px solid var(--border);
}
.macro-pill-val{font-size:14px;font-weight:800;display:block;color:var(--text2)}
.macro-pill-label{
  font-size:9px;color:var(--text3);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;display:block;margin-top:1px;
}

/* PAGES */
.page{display:none;padding:14px 14px 96px}
.page.active{display:block}

.section-label{
  font-size:11px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;
  margin:18px 0 8px;
}
.section-label:first-child{margin-top:0}

/* WEEK STRIP */
.week-strip{display:flex;gap:6px;padding:2px 0;overflow-x:auto;scrollbar-width:none}
.week-strip::-webkit-scrollbar{display:none}
.week-dot{
  flex-shrink:0;width:42px;height:54px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;transition:all .15s;
  border:1.5px solid var(--border);background:var(--bg2);
}
.week-dot.active{background:var(--text);border-color:var(--text)}
.week-dot-day{font-size:10px;font-weight:700;color:var(--text2)}
.week-dot.active .week-dot-day{color:var(--bg)}
.week-dot-kcal{font-size:9px;color:var(--text3)}
.week-dot.active .week-dot-kcal{color:rgba(0,0,0,.5)}

/* TODAY */
.today-card{
  background:var(--bg2);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;margin-top:12px;
}
.today-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--border);
}
.today-day-name{font-size:16px;font-weight:700}
.training-badge{
  font-size:10px;font-weight:600;color:var(--text2);
  background:var(--bg3);padding:3px 9px;border-radius:20px;
  border:1px solid var(--border);
}

/* MEAL ROW (Heute + Woche) */
.meal-row{
  display:flex;align-items:center;
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .1s;overflow:hidden;
}
.meal-row:last-child{border-bottom:none}
.meal-row:active{background:var(--bg3)}
.meal-row-thumb{
  width:70px;height:70px;flex-shrink:0;
  object-fit:cover;background:var(--bg3);
  display:block;
}
.meal-row-thumb-fallback{
  width:70px;height:70px;flex-shrink:0;
  background:var(--bg3);display:flex;align-items:center;
  justify-content:center;font-size:24px;
}
.meal-row-body{flex:1;min-width:0;padding:10px 12px}
.meal-row-cat{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.meal-row-name{font-size:14px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-row-kcal{font-size:11px;color:var(--text3);margin-top:2px}
.meal-row-arrow{font-size:16px;color:var(--text3);padding-right:12px;flex-shrink:0}

/* WEEK OVERVIEW */
.week-overview-card{
  background:var(--bg2);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;margin-bottom:8px;
}
.week-ov-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--border);
}
.week-ov-day{font-size:15px;font-weight:700}
.week-ov-kcal{font-size:12px;color:var(--text3)}
.week-ov-row{
  display:flex;align-items:center;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .1s;overflow:hidden;
}
.week-ov-row:last-child{border-bottom:none}
.week-ov-row:active{background:var(--bg3)}
.week-ov-thumb{
  width:52px;height:52px;flex-shrink:0;
  object-fit:cover;background:var(--bg3);display:block;
}
.week-ov-body{flex:1;min-width:0;padding:8px 12px;display:flex;align-items:center;gap:8px}
.week-ov-cat{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;min-width:36px}
.week-ov-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.week-ov-kcal2{font-size:11px;color:var(--text3);white-space:nowrap}

/* MEALS PAGE */
.meals-filter{
  display:flex;gap:6px;margin-bottom:12px;
  overflow-x:auto;padding:2px 0;scrollbar-width:none;
}
.meals-filter::-webkit-scrollbar{display:none}
.filter-btn{
  flex-shrink:0;padding:6px 14px;border-radius:20px;
  font-size:12px;font-weight:600;
  border:1.5px solid var(--border);color:var(--text2);
  background:var(--bg2);transition:all .15s;white-space:nowrap;
}
.filter-btn.active{background:var(--text);border-color:var(--text);color:var(--bg)}

.meal-card{
  background:var(--bg2);border-radius:var(--radius);
  border:1px solid var(--border);margin-bottom:8px;
  cursor:pointer;overflow:hidden;transition:transform .1s;
}
.meal-card:active{transform:scale(.99)}
.meal-card-top{display:flex;align-items:stretch;min-height:80px}
.meal-card-img{
  width:90px;flex-shrink:0;
  object-fit:cover;display:block;background:var(--bg3);
}
.meal-card-body{flex:1;min-width:0;padding:12px}
.meal-card-cat{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.meal-card-name{font-size:14px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
.meal-card-time{font-size:11px;color:var(--text3);margin-top:3px}
.meal-card-macros{
  display:flex;gap:0;border-top:1px solid var(--border);
}
.meal-macro{
  flex:1;padding:7px 4px;text-align:center;
  border-right:1px solid var(--border);
}
.meal-macro:last-child{border-right:none}
.meal-macro-val{font-size:12px;font-weight:700;color:var(--text2);display:block}
.meal-macro-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block}

/* SHOPPING */
.shop-progress-wrap{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;
}
.shop-progress-label{
  display:flex;justify-content:space-between;
  font-size:12px;color:var(--text3);margin-bottom:6px;
}
.progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--text);border-radius:2px;transition:width .3s}
.shop-cat-header{
  font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;
  margin:16px 0 6px;
}
.shop-item{
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);border-radius:10px;
  border:1px solid var(--border);padding:10px 12px;
  margin-bottom:6px;cursor:pointer;transition:opacity .15s;
}
.shop-item.done{opacity:.35}
.shop-item-check{
  width:20px;height:20px;border-radius:6px;flex-shrink:0;
  border:1.5px solid var(--border);display:flex;align-items:center;
  justify-content:center;font-size:11px;transition:all .15s;
}
.shop-item.done .shop-item-check{
  background:var(--text);border-color:var(--text);color:var(--bg);
}
.shop-item-text{flex:1}
.shop-item-name{font-size:13px;font-weight:600}
.shop-item-amt{font-size:11px;color:var(--text3);margin-top:1px}

/* EXTRAS */
.supp-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
}
.supp-name{font-size:14px;font-weight:700;margin-bottom:3px}
.supp-dose{font-size:12px;color:var(--text2);margin-bottom:2px}
.supp-timing{font-size:11px;color:var(--text3);margin-bottom:4px}
.supp-note{font-size:11px;color:var(--text3);line-height:1.4}
.storage-table{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:12px;
}
.storage-row{
  display:flex;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--border);gap:12px;
}
.storage-row:last-child{border-bottom:none}
.storage-food{flex:1;font-size:13px;font-weight:600}
.storage-time{font-size:12px;color:var(--text2);font-weight:700}
.storage-temp{font-size:11px;color:var(--text3)}
.batch-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
}
.batch-day{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:6px}
.batch-task{font-size:12px;color:var(--text3);padding:3px 0 3px 12px;position:relative;line-height:1.4}
.batch-task::before{content:"·";position:absolute;left:0}

.hint-box{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;
  font-size:12px;color:var(--text3);line-height:1.5;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;padding:8px 0;
  padding-bottom:calc(8px + var(--safe-b));
  z-index:100;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:6px 0;color:var(--text3);transition:color .15s;
}
.nav-btn svg{width:20px;height:20px;stroke:currentColor}
.nav-btn.active{color:var(--text)}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.3px}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:200;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{
  background:var(--bg2);width:100%;max-width:480px;margin:0 auto;
  border-radius:20px 20px 0 0;
  max-height:92dvh;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  -webkit-overflow-scrolling:touch;
  position:relative;
}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{
  width:36px;height:4px;background:var(--bg3);border-radius:2px;
  margin:10px auto 0;
}
.modal-close-btn{
  position:absolute;top:14px;right:14px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.5);color:var(--text2);
  font-size:12px;display:flex;align-items:center;justify-content:center;
  z-index:5;backdrop-filter:blur(8px);
}
.modal-hero{
  width:100%;height:220px;overflow:hidden;
  background:var(--bg3);position:relative;
}
.modal-hero-img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.modal-inner{padding:16px 16px 40px}
.modal-cat{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.modal-title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:3px}
.modal-time{font-size:12px;color:var(--text3);margin-bottom:14px}
.modal-macros{display:flex;gap:6px;margin-bottom:14px}
.modal-macro-box{
  flex:1;background:var(--bg3);border-radius:10px;
  border:1px solid var(--border);padding:8px 4px;text-align:center;
}
.modal-macro-val{font-size:15px;font-weight:800;color:var(--text2);display:block}
.modal-macro-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:1px}
.modal-section-title{
  font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;margin-top:16px;
}
.ingredient-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.ingredient-row:last-child{border-bottom:none}
.ingredient-name{font-size:13px;font-weight:500}
.ingredient-amt{font-size:12px;color:var(--text2);font-weight:600}
.step-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.step-row:last-child{border-bottom:none}
.step-num{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:var(--text);color:var(--bg);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.step-text{font-size:13px;font-weight:500;line-height:1.5}
.step-hint{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4}
.tip-box{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-top:14px;
  font-size:12px;color:var(--text2);line-height:1.5;
}
.tip-box b{color:var(--text);font-weight:700}
</style>
</head>
<body>
<div id="app">

<div class="app-header">
  <div class="header-top">
    <div>
      <div class="header-greeting">Lean Bulk · Sebastian</div>
      <div class="header-name" id="headerDayName">Heute</div>
    </div>
    <div class="header-badge">LEAN BULK</div>
  </div>
  <div class="macro-strip">
    <div class="macro-pill"><span class="macro-pill-val" id="stripKcal">–</span><span class="macro-pill-label">kcal</span></div>
    <div class="macro-pill"><span class="macro-pill-val" id="stripProt">–</span><span class="macro-pill-label">Protein</span></div>
    <div class="macro-pill"><span class="macro-pill-val" id="stripCarb">–</span><span class="macro-pill-label">Carbs</span></div>
    <div class="macro-pill"><span class="macro-pill-val" id="stripFat">–</span><span class="macro-pill-label">Fett</span></div>
  </div>
</div>

<div class="page active" id="pageHeute">
  <div class="week-strip" id="weekStrip"></div>
  <div id="todayContent"></div>
  <div class="hint-box" style="margin-top:10px">💡 Tippe auf ein Gericht um das vollständige Rezept zu sehen.</div>
</div>

<div class="page" id="pageWoche">
  <p class="section-label">Wochenplan</p>
  <div id="weekOverview"></div>
</div>

<div class="page" id="pageMahlzeiten">
  <div class="meals-filter">
    <button class="filter-btn active" onclick="filterMeals('all',this)">Alle</button>
    <button class="filter-btn" onclick="filterMeals('fruehstueck',this)">Frühstück</button>
    <button class="filter-btn" onclick="filterMeals('hauptgericht',this)">Hauptgerichte</button>
    <button class="filter-btn" onclick="filterMeals('snack',this)">Snacks</button>
  </div>
  <div id="mealsContainer"></div>
</div>

<div class="page" id="pageEinkauf">
  <div class="shop-progress-wrap">
    <div class="shop-progress-label">
      <span>Einkaufsliste</span>
      <span id="shopProgressText">0 erledigt</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="shopProgress" style="width:0%"></div></div>
  </div>
  <div id="shopContainer"></div>
</div>

<div class="page" id="pageExtras">
  <p class="section-label">Supplements</p>
  <div id="supplementsContainer"></div>
  <p class="section-label">Kühlschrank · Haltbarkeit</p>
  <div id="storageContainer"></div>
  <p class="section-label">Batch Cooking</p>
  <div class="hint-box" style="margin-bottom:10px">⏱️ 2× pro Woche kochen genügt — Sonntag + Mittwoch.</div>
  <div id="batchContainer"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showPage('pageHeute',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span class="nav-label">Heute</span>
  </button>
  <button class="nav-btn" onclick="showPage('pageWoche',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    <span class="nav-label">Woche</span>
  </button>
  <button class="nav-btn" onclick="showPage('pageMahlzeiten',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 015 5v1H7V7a5 5 0 015-5z"/><rect x="3" y="8" width="18" height="13" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
    <span class="nav-label">Rezepte</span>
  </button>
  <button class="nav-btn" onclick="showPage('pageEinkauf',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    <span class="nav-label">Einkauf</span>
  </button>
  <button class="nav-btn" onclick="showPage('pageExtras',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>
    <span class="nav-label">Extras</span>
  </button>
</nav>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="mealModal" onclick="closeModal(event)">
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <button class="modal-close-btn" onclick="closeModal()">✕</button>
    <div class="modal-hero" id="modalHero">
      <img class="modal-hero-img" id="modalHeroImg" src="" alt="" onerror="this.parentElement.style.display='none'">
    </div>
    <div class="modal-inner" id="modalContent"></div>
  </div>
</div>

<script>
const IMG_VERIFIED = {
  // Frühstück – lokale Fotos wo vorhanden, sonst Unsplash
  F1:"https://plus.unsplash.com/premium_photo-1668615553287-458a19327285?w=700&q=85&auto=format&fit=crop",
  F2:"https://images.unsplash.com/photo-1525351484163-7529414344d8?w=700&q=85&auto=format&fit=crop",
  F3:"https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=700&q=85&auto=format&fit=crop",
  F4:"img/skyr-bowl.webp",
  F5:"img/bagel-ei.webp",
  F6:"https://images.unsplash.com/photo-1484723091739-30a097e8f929?w=700&q=85&auto=format&fit=crop",
  // Hauptgerichte – alle lokal
  M1:"img/haehnchen-bowl.jpg",
  M2:"img/rinderhack-reisbowl.jpg",
  M3:"img/haehnchen-wrap.jpg",
  M4:"img/haehnchen-kartoffel.jpg",
  M5:"img/gyros-teller.jpg",
  M6:"https://images.unsplash.com/photo-1612874742237-6526221588e3?w=700&q=85&auto=format&fit=crop",
  M7:"img/koefte.jpg",

// ━━━ STATE ━━━
let todayIdx = new Date().getDay();
todayIdx = todayIdx === 0 ? 6 : todayIdx - 1;
let selectedDay = todayIdx;

// ━━━ NAV ━━━
function showPage(id, btn) {
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  window.scrollTo(0,0);
}

// ━━━ HEUTE ━━━
function buildWeekStrip() {
  const strip = document.getElementById("weekStrip");
  strip.innerHTML = WEEK.map((w,i) => `
    <div class="week-dot ${i===selectedDay?"active":""}" onclick="selectDay(${i})">
      <span class="week-dot-day">${w.day}</span>
      <span class="week-dot-kcal">${(w.kcal/1000).toFixed(1)}k</span>
    </div>
  `).join("");
}

function selectDay(i) {
  selectedDay = i;
  buildWeekStrip();
  buildTodayContent();
  updateHeader();
}

function updateHeader() {
  const d = WEEK[selectedDay];
  document.getElementById("headerDayName").textContent = selectedDay===todayIdx ? "Heute" : d.day;
  document.getElementById("stripKcal").textContent = d.kcal.toLocaleString("de");
  document.getElementById("stripProt").textContent = d.prot+"g";
  document.getElementById("stripCarb").textContent = d.carb+"g";
  document.getElementById("stripFat").textContent = d.fat+"g";
}

const CAT_LABEL = {F:"Frühstück",M:"Mittag",S:"Snack",A:"Abend"};

function imgTag(code, cls) {
  const url = IMG_VERIFIED[code];
  if (!url) return `<div class="${cls}" style="background:var(--bg3)"></div>`;
  return `<img class="${cls}" src="${url}" alt="" loading="lazy" onerror="this.style.opacity=0">`;
}

function buildTodayContent() {
  const d = WEEK[selectedDay];
  const rows = ["F","M","S","A"].map(slot => {
    const m = MEALS[d[slot]];
    if (!m) return "";
    return `<div class="meal-row" onclick="openMeal('${m.code}')">
      ${imgTag(m.code,"meal-row-thumb")}
      <div class="meal-row-body">
        <div class="meal-row-cat">${CAT_LABEL[slot]}</div>
        <div class="meal-row-name">${m.name}</div>
        <div class="meal-row-kcal">${m.kcal} kcal · P ${m.prot}g · KH ${m.carb}g · F ${m.fat}g</div>
      </div>
      <div class="meal-row-arrow">›</div>
    </div>`;
  }).join("");
  document.getElementById("todayContent").innerHTML = `
    <div class="today-card">
      <div class="today-header">
        <div class="today-day-name">${selectedDay===todayIdx?"Heute – ":""}${WEEK[selectedDay].day}</div>
        <div class="training-badge">🏋️ ${WEEK[selectedDay].training}</div>
      </div>
      ${rows}
    </div>`;
}

  document.getElementById("mealsContainer").innerHTML = Object.values(MEALS).map(m => `
    <div class="meal-card" data-cat="${m.cat}" data-flex="${m.flexible||false}" onclick="openMeal('${m.code}')">
      <div class="meal-card-top">
        ${imgTag(m.code,"meal-card-img")}
        <div class="meal-card-body">
          <div class="meal-card-cat">${catLabel[m.cat]||m.cat}</div>
          <div class="meal-card-name">${m.name}</div>
          <div class="meal-card-time">${m.time}</div>
        </div>
      </div>
      <div class="meal-card-macros">
        <div class="meal-macro"><span class="meal-macro-val">${m.kcal}</span><span class="meal-macro-label">kcal</span></div>
        <div class="meal-macro"><span class="meal-macro-val">${m.prot}g</span><span class="meal-macro-label">Protein</span></div>
        <div class="meal-macro"><span class="meal-macro-val">${m.carb}g</span><span class="meal-macro-label">Carbs</span></div>
        <div class="meal-macro"><span class="meal-macro-val">${m.fat}g</span><span class="meal-macro-label">Fett</span></div>
      </div>
    </div>
  `).join("");
}

function filterMeals(filter, btn) {
  document.querySelectorAll(".meal-card").forEach(card => {
    const cat = card.dataset.cat;
    const flex = card.dataset.flex === "true";
    let show = filter === "all";
    if (!show) {
      if (filter === "hauptgericht") show = cat === "hauptgericht" || flex;
      else show = cat === filter;
    }
    card.style.display = show ? "block" : "none";
  });
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

// ━━━ EINKAUF ━━━
const shopState = {};
function buildShopPage() {
  SHOPPING.forEach(cat => cat.items.forEach((_,i) => shopState[cat.cat+i] = false));
  renderShop();
}
function toggleShop(key) {
  shopState[key] = !shopState[key];
  renderShop();
}
function renderShop() {
  const total = Object.keys(shopState).length;
  const done = Object.values(shopState).filter(Boolean).length;
  document.getElementById("shopProgressText").textContent = done+" / "+total+" erledigt";
  document.getElementById("shopProgress").style.width = (total?done/total*100:0)+"%";
  document.getElementById("shopContainer").innerHTML = SHOPPING.map(cat => {
    const items = cat.items.map((item,i) => {
      const key = cat.cat+i;
      const d = shopState[key];
      return `<div class="shop-item ${d?"done":""}" onclick="toggleShop('${key}')">
        <div class="shop-item-check">${d?"✓":""}</div>
        <div class="shop-item-text">
          <div class="shop-item-name">${item.name}</div>
          <div class="shop-item-amt">${item.amt}</div>
        </div>
      </div>`;
    }).join("");
    return `<div class="shop-cat-header">${cat.cat}</div>${items}`;
  }).join("");
}

// ━━━ MODAL ━━━
function openMeal(code) {
  const m = MEALS[code];
  if (!m) return;
  const hero = document.getElementById("modalHero");
  const img = document.getElementById("modalHeroImg");
  const url = IMG_VERIFIED[code];
  if (url) {
    hero.style.display = "block";
    img.src = url;
  } else {
    hero.style.display = "none";
  }
  const catLabel = m.cat==="fruehstueck"?"Frühstück":m.cat==="hauptgericht"?"Hauptgericht":"Snack";
  const ingHtml = m.ingredients.map(i=>`
    <div class="ingredient-row">
      <span class="ingredient-name">${i.name}</span>
      <span class="ingredient-amt">${i.amt}</span>
    </div>`).join("");
  let stepsHtml = "";
  if (m.steps && m.steps.length) {
    stepsHtml = `<div class="modal-section-title">Zubereitung</div>`+
      m.steps.map((s,i)=>`<div class="step-row">
        <div class="step-num">${i+1}</div>
        <div><div class="step-text">${s.t}</div>${s.h?`<div class="step-hint">💡 ${s.h}</div>`:""}</div>
      </div>`).join("");
  }
  document.getElementById("modalContent").innerHTML = `
    <div class="modal-cat">${catLabel}</div>
    <div class="modal-title">${m.name}</div>
    <div class="modal-time">⏱ ${m.time}</div>
    <div class="modal-macros">
      <div class="modal-macro-box"><span class="modal-macro-val">${m.kcal}</span><span class="modal-macro-label">kcal</span></div>
      <div class="modal-macro-box"><span class="modal-macro-val">${m.prot}g</span><span class="modal-macro-label">Protein</span></div>
      <div class="modal-macro-box"><span class="modal-macro-val">${m.carb}g</span><span class="modal-macro-label">Carbs</span></div>
      <div class="modal-macro-box"><span class="modal-macro-val">${m.fat}g</span><span class="modal-macro-label">Fett</span></div>
    </div>
    <div class="modal-section-title">Zutaten</div>
    ${ingHtml}
    ${stepsHtml}
    ${m.tip?`<div class="tip-box"><b>Tipp:</b> ${m.tip}</div>`:""}
  `;
  document.getElementById("modalSheet").scrollTop = 0;
  document.getElementById("mealModal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(e) {
  // Called either with no args (X button) or with click event (backdrop tap)
  if (!e || e.target === document.getElementById("mealModal")) {
    document.getElementById("mealModal").classList.remove("open");
    document.body.style.overflow = "";
  }
}
